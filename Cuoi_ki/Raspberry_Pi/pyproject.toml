[project]
name = "photobooth-pi"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<2",
    "pydantic>=2.6,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
pi = [
    "opencv-python>=4.8,<5",
    "paho-mqtt>=2.1,<3",
    "websockets>=12,<16",
    "gpiozero>=2,<3",
    "smbus2>=0.4,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "pi*"]
